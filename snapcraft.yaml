name: sqlquery
base: core24
summary: Lightweight cross-platform SQL database explorer
description: |
  SQL Query Analyzer is a lightweight and efficient desktop utility designed
  to simplify the process of managing SQLite, PostgreSQL, SQL Server and
  MySQL/MariaDB databases.

  It provides an intuitive interface for executing queries and direct table editing,
  making database operations seamless and straightforward.

  Features:
  - Cross platform - Runs natively on Windows, MacOS, and Linux
  - Easy-to-use interface for executing SQL queries
  - Fast table data editing
  - Persists application state and reloads last session on startup
  - Export database schema as CREATE TABLE statements
  - Export data as an SQL script containing INSERT statements or as CSV files
  - Desktop color theme awareness with automatic switching between dark/light themes

version: 1.0.0
grade: stable
confinement: strict

apps:
  sqlquery:
    command: bin/SQLQueryAnalyzer
    desktop: usr/share/applications/sqlquery.desktop
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - home
      - network

parts:
  sqlquery:
    plugin: dump
    source: src/linux
    source-type: local
    stage-packages:
      - libqt6core6
      - libqt6gui6
      - libqt6widgets6
      - libqt6sql6
      - libqt6sql6-sqlite
      - libqt6sql6-psql
      - libqt6sql6-mysql
      - libqt6sql6-odbc
      - libqt6svg6
      - qt6-qpa-plugins
      - qt6-wayland
      - libqt6waylandclient6
      - libgl1
      - libxcb1
      - libx11-6
      - libxau6
      - libxdmcp6
      - libfontconfig1
      - libxkbcommon0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-render0
      - libxcb-shape0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-util1
      - libxcb-xfixes0
      - libxcb-xkb1
      - libxkbcommon-x11-0
      - libxcb-cursor0
      - libicu74
      - libtiff6
      - libwebp7
      - libwebpdemux2
      - libwebpmux3
